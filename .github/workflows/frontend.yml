# Intégration continue du frontend.
# lint → types → tests → build → e2e + axe → Lighthouse CI → image Docker ; sur main :
# publication de l'image puis déploiement (VPS derrière Traefik, même hôte que l'API).
name: CI frontend

on:
  push:
    branches: [main, develop]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

# Monorepo : chaque commande s'exécute dans le dossier de l'application.
defaults:
  run:
    working-directory: frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_SITE_URL: http://localhost:5173
  NEXT_PUBLIC_API_URL: http://localhost:3000

jobs:
  quality:
    name: Lint, format, typage et client d'API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Le client typé doit correspondre exactement à openapi/openapi.json.
      - name: Client d'API à jour
        run: npm run api:check

  unit:
    name: Tests unitaires (composants, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm test

  build:
    name: Build de production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      # Build de test : pages générées avec l'API factice (tests/mock-api). L'image Docker,
      # elle, est construite à part avec les vraies variables (job « docker »).
      - run: npm run build:e2e
      - uses: actions/upload-artifact@v5
        with:
          name: next-build
          path: frontend/.next/standalone
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Parcours e2e et accessibilité (Playwright + axe)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - uses: actions/download-artifact@v6
        with:
          name: next-build
          path: frontend/.next/standalone
      - run: npx playwright install --with-deps chromium
      # Playwright démarre l'API factice et le serveur. Les parcours marqués @api exigent le
      # vrai backend : ils ne tournent pas ici.
      - run: npm run test:e2e -- --grep-invert @api
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (mobile)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - uses: actions/download-artifact@v6
        with:
          name: next-build
          path: frontend/.next/standalone
      - run: npm run lhci

  docker:
    name: Image Docker
    needs: [quality, unit, e2e, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: diani-frontend:ci
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Production (fusion sur main) ------------------------------------------------------------
  # Image construite avec les adresses de production : les variables NEXT_PUBLIC_* sont figées
  # dans le JavaScript, et les pages statiques sont générées avec les contenus de l'API publique.
  publish:
    name: Publication de l'image (ghcr.io)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Nom de l'image
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "tag=${GITHUB_SHA::12}"
            echo "image=ghcr.io/$owner/les-secrets-de-diani-frontend"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://${{ vars.SITE_DOMAIN }}
            NEXT_PUBLIC_API_URL=https://${{ vars.API_DOMAIN }}
            NEXT_PUBLIC_MEDIA_URL=${{ vars.MEDIA_URL }}
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.PLAUSIBLE_DOMAIN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          labels: org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Déploiement en production
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.SITE_DOMAIN }}
    # Même groupe que le déploiement de l'API : jamais deux déploiements en même temps.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Clé SSH du déploiement
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Fichiers d'exploitation vers le serveur
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          tar -czf - docker-compose.prod.yml docker scripts Makefile \
            | ssh -i ~/.ssh/deploy "$TARGET" 'cd /opt/diani && tar -xzf -'
      - name: Déploiement du site (bascule progressive, réchauffage, fumée, retour arrière)
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: ssh -i ~/.ssh/deploy "$TARGET" "cd /opt/diani && ./scripts/deploy-web.sh '$TAG'"
      - name: Test de fumée depuis l'extérieur (Cloudflare, DNS, TLS)
        run: ./scripts/smoke-web.sh "https://${{ vars.SITE_DOMAIN }}"
