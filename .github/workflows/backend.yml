# Intégration et déploiement continus du backend.
#   Toute branche : lint → tests unitaires et e2e → audit → image (scan Trivy).
#   main seulement : publication des images sur ghcr.io → déploiement SSH (sauvegarde,
#   migrations, bascule, test de fumée, retour arrière automatique) → test de fumée externe.
name: CI backend

on:
  push:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

# Monorepo : chaque commande s'exécute dans le dossier de l'application.
defaults:
  run:
    working-directory: backend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Lint, format et typage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-fund
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Scripts d'exploitation (déploiement, sauvegarde, restauration) : shellcheck préinstallé.
      - name: Scripts shell
        run: shellcheck scripts/*.sh
      # docs/openapi.json alimente le client typé du frontend : il doit refléter le code.
      - name: Spécification OpenAPI à jour
        run: npm run openapi:check

  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-fund
      - run: npx prisma generate
      - run: npm run test:cov

  e2e:
    name: Tests e2e (Postgres + Redis éphémères)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: diani_test
          POSTGRES_USER: diani
          POSTGRES_PASSWORD: diani_test_password
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U diani -d diani_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Stockage S3 de test (les services GitHub ne permettent pas de passer une commande).
      - name: Démarrer SeaweedFS (S3)
        run: |
          docker run -d --name s3-test -p 58333:8333 chrislusf/seaweedfs:4.48 server -s3 -dir=/data
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:58333/healthz && exit 0; sleep 2; done
          docker logs s3-test; exit 1
      - run: npm ci --no-fund
      - run: npx prisma generate
      - run: npm run test:e2e -- --coverage

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Bloquant : toute vulnérabilité dans les dépendances de production.
      - run: npm audit --omit=dev --audit-level=low
      # Bloquant : vulnérabilité haute ou critique dans l'outillage de développement.
      - run: npm audit --audit-level=high

  image:
    name: Image Docker (build + scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, unit, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build de l'image d'exécution
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: runtime
          load: true
          tags: diani-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan de vulnérabilités (Trivy)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0 image --exit-code 1 --severity HIGH,CRITICAL
          --ignore-unfixed --no-progress diani-api:ci
      - name: Test de fumée du conteneur (configuration invalide → refus de démarrer)
        run: |
          set +e
          docker run --rm diani-api:ci > out.log 2>&1
          code=$?
          set -e
          cat out.log
          test "$code" -ne 0
          grep -q "Configuration invalide" out.log

  publish:
    name: Publication des images (ghcr.io)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [image, audit]
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Nom des images
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "tag=${GITHUB_SHA::12}"
            echo "api=ghcr.io/$owner/les-secrets-de-diani-backend"
            echo "migrate=ghcr.io/$owner/les-secrets-de-diani-backend-migrate"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image API et worker
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Image des migrations
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: migrate
          push: true
          tags: ${{ steps.meta.outputs.migrate }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          labels: org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Déploiement en production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [publish]
    # Environnement GitHub « production » : secrets du serveur, validation manuelle possible.
    environment:
      name: production
      url: https://${{ vars.API_DOMAIN }}
    # Jamais deux déploiements en même temps, et jamais interrompu en cours de route.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Clé SSH du déploiement
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Empreinte du serveur épinglée (pas de ssh-keyscan : pas de confiance au premier contact).
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Fichiers d'exploitation vers le serveur
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          tar -czf - docker-compose.prod.yml docker scripts Makefile \
            | ssh -i ~/.ssh/deploy "$TARGET" 'cd /opt/diani && tar -xzf -'
      - name: Déploiement (sauvegarde, migrations, bascule, fumée, retour arrière)
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: ssh -i ~/.ssh/deploy "$TARGET" "cd /opt/diani && ./scripts/deploy.sh '$TAG'"
      - name: Test de fumée depuis l'extérieur (Cloudflare, DNS, TLS)
        run: ./scripts/smoke.sh "https://${{ vars.API_DOMAIN }}"
