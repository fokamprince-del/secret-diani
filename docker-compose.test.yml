# Infrastructure éphémère pour les tests e2e (données en mémoire, détruites à l'arrêt).
#   make test-e2e   (ou : docker compose -f docker-compose.test.yml up -d --wait)
name: diani-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diani_test
      POSTGRES_USER: diani
      POSTGRES_PASSWORD: diani_test_password
    ports: ['127.0.0.1:55432:5432']
    tmpfs: [/var/lib/postgresql/data]
    volumes: ['./docker/postgres:/docker-entrypoint-initdb.d:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U diani -d diani_test']
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
