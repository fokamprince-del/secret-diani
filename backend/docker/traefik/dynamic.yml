# Configuration dynamique Traefik (production) — routage vers l'API et durcissement TLS.
http:
  routers:
    api:
      rule: 'Host(`{{ env "API_DOMAIN" }}`)'
      entryPoints: [websecure]
      service: api
      middlewares: [security-headers, limit-body, retry-other-instance]
      tls:
        certResolver: letsencrypt
        options: modern

  services:
    api:
      loadBalancer:
        servers:
          - url: 'http://api:3000'
          - url: 'http://api-2:3000'
        # Une instance qui redémarre (déploiement) est retirée en 5 s au plus.
        healthCheck:
          path: /health
          interval: 5s
          timeout: 3s

  middlewares:
    security-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
    # Connexion refusée par une instance qui s'arrête : la requête part vers l'autre. Traefik ne
    # réessaie que si le serveur n'a pas répondu (jamais après une réponse, quel que soit son statut).
    retry-other-instance:
      retry:
        attempts: 2
        initialInterval: 100ms
    limit-body:
      buffering:
        # Limite haute (téléversements de médias) ; les routes JSON sont limitées plus bas par l'API.
        maxRequestBodyBytes: 26214400

tls:
  options:
    modern:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
